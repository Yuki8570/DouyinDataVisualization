<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SunEvo 内容数据看板 · 抖音 / 视频号</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar reveal">
      <nav class="nav-switch">
        <button type="button" class="active" data-account="douyin">抖音公司号</button>
        <button type="button" data-account="shipinhao">视频号公司号</button>
        <button type="button" data-account="jiangwei_douyin">江炜抖音</button>
        <button type="button" data-account="jiangwei_shipinhao">江炜视频号</button>
      </nav>
      <div class="top-actions">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />
        <button type="button" class="btn primary" id="pickFile">选择 Excel</button>
        <button type="button" class="btn" id="exportBtn">导出已保存数据</button>
        <button type="button" class="btn" id="resetBtn">清空保存 / 恢复内置</button>
      </div>
    </div>

    <header class="hero reveal">
      <div class="brand-row">
        <div class="brand">SunEvo <span id="brandSub">/ 抖音公司号</span></div>
        <div class="meta" id="metaChips"></div>
      </div>
      <h1 id="pageTitle">抖音公司号数据可视化</h1>
      <p class="lede" id="pageLede">
        支持直接上传抖音号 / 视频号导出的 Excel，自动识别格式并生成看板。
      </p>
      <p class="upload-status" id="uploadStatus" hidden></p>
    </header>

    <div class="toolbar reveal">
      <div>
        <label for="sheetSelect">数据范围</label>
        <select id="sheetSelect" class="select"></select>
      </div>
      <div id="sourceChip" class="chip">来源：内置样例</div>
    </div>

    <div id="dashboard"></div>

    <footer>
      <span>SunEvo 内容数据看板 · 抖音 / 视频号</span>
      <span>Excel 仅在浏览器本地解析</span>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="assets/default-data.js?v=20261009"></script>
  <script src="assets/viz.js?v=20261009"></script>
  <script>
    try { localStorage.removeItem("sunevo-dash-store-v1"); } catch (e) {}
    const state = {
      account: "douyin",
      platform: "douyin",
      kind: "works",
      sheets: {},
      activeSheet: "全部",
      posts: [],
      source: "builtin",
      fileName: "",
      added: [],
      replaced: [],
    };

    const brandSub = document.getElementById("brandSub");
    const pageTitle = document.getElementById("pageTitle");
    const pageLede = document.getElementById("pageLede");
    const metaChips = document.getElementById("metaChips");
    const sheetSelect = document.getElementById("sheetSelect");
    const uploadStatus = document.getElementById("uploadStatus");
    const sourceChip = document.getElementById("sourceChip");
    const fileInput = document.getElementById("fileInput");

    function setStatus(message, tone) {
      if (!message) {
        uploadStatus.hidden = true;
        uploadStatus.textContent = "";
        uploadStatus.className = "upload-status";
        return;
      }
      uploadStatus.hidden = false;
      uploadStatus.className = "upload-status" + (tone ? " " + tone : "");
      uploadStatus.textContent = message;
    }

    function accountLabel(account) {
      return (
        {
          douyin: "抖音公司号",
          shipinhao: "视频号公司号",
          jiangwei_douyin: "江炜抖音",
          jiangwei_shipinhao: "江炜视频号",
        }[account] || account
      );
    }

    function isJiangwei(account) {
      return String(account || "").startsWith("jiangwei_");
    }

    function pickDefaultSheet(keys) {
      if (!keys.length) return "全部";
      // 默认单月，且取最新月份（sortSheetNames 已按月份升序）
      return keys[keys.length - 1];
    }

    function loadAccount(account, opts) {
      const options = opts || {};
      if (!window.DEFAULT_DATA || !window.DEFAULT_DATA[account]) {
        setStatus("内置数据未加载成功，请刷新页面或检查 assets/default-data.js", "err");
      }
      const resolved = SunevoDash.resolveAccountSheets(account);
      state.account = account;
      state.platform = account;
      state.kind = isJiangwei(account) ? "daily" : "works";
      state.sheets = resolved.sheets;
      state.source = resolved.source;
      state.fileName = (resolved.saved && resolved.saved.lastFile) || "";
      if (resolved.source === "saved" && resolved.saved) {
        setStatus(
          `已加载「${accountLabel(account)}」（内置 7/8 月保留；本机上传月份已合并）。`,
          "ok"
        );
        sourceChip.textContent = state.fileName
          ? `来源：内置 + 本机 · ${state.fileName}`
          : "来源：内置 + 本机保存";
      } else {
        setStatus("");
        sourceChip.textContent = "来源：内置样例";
      }
      state.added = [];
      state.replaced = [];
      const keys = SunevoDash.sortSheetNames(Object.keys(state.sheets));
      state.activeSheet = options.keepSheet && (keys.includes(state.activeSheet) || state.activeSheet === "全部")
        ? state.activeSheet
        : pickDefaultSheet(keys);
      refreshChrome();
      rebuildSheetSelect();
      applySheet();
    }

    function refreshChrome() {
      const map = {
        douyin: {
          brand: "/ 抖音公司号",
          title: "抖音公司号数据可视化",
          lede: "公司号作品明细。上传抖音导出 Excel 可自动保存并按月份新增/更新。",
        },
        shipinhao: {
          brand: "/ 视频号公司号",
          title: "视频号公司号数据可视化",
          lede: "公司号视频明细。上传视频号导出 Excel 可自动保存并按月份新增/更新。",
        },
        jiangwei_douyin: {
          brand: "/ 江炜 · 抖音",
          title: "江炜个人号 · 抖音日数据",
          lede: "按日汇总（投稿/播放/互动/完播）。可上传「数据表现_短视频全量指标」Excel 自动合并月份。",
        },
        jiangwei_shipinhao: {
          brand: "/ 江炜 · 视频号",
          title: "江炜个人号 · 视频号日数据",
          lede: "按日汇总（播放/推荐/喜欢等）。可上传「视频号视频详情数据」CSV 自动合并月份。",
        },
      };
      const conf = map[state.platform] || map.douyin;
      brandSub.textContent = conf.brand;
      pageTitle.textContent = conf.title;
      pageLede.textContent = conf.lede;
      document.querySelectorAll("[data-account]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.account === state.account);
      });
    }

    function rebuildSheetSelect() {
      const keys = SunevoDash.sortSheetNames(Object.keys(state.sheets));
      const options = [];
      if (keys.length > 1) options.push(["全部", "全部合计"]);
      keys.forEach((k) => options.push([k, k]));
      if (!keys.includes(state.activeSheet) && state.activeSheet !== "全部") {
        state.activeSheet = pickDefaultSheet(keys);
      }
      sheetSelect.innerHTML = options
        .map(
          ([v, label]) =>
            `<option value="${v}" ${state.activeSheet === v ? "selected" : ""}>${label}</option>`
        )
        .join("");
    }

    function applySheet() {
      const keys = SunevoDash.sortSheetNames(Object.keys(state.sheets));
      let posts = [];
      if (state.activeSheet === "全部") {
        keys.forEach((k) => {
          posts = posts.concat(state.sheets[k] || []);
        });
      } else {
        posts = state.sheets[state.activeSheet] || [];
      }
      state.posts = posts;
      const allDaily = posts.length > 0 && posts.every((p) => p.kind === "daily");
      state.kind = allDaily || isJiangwei(state.platform) ? "daily" : "works";
      const unit = state.kind === "daily" ? "天" : "条作品";
      metaChips.innerHTML = `
        <span class="chip">${accountLabel(state.platform)}</span>
        <span class="chip"><strong>${state.activeSheet}</strong></span>
        <span class="chip">${posts.length} ${unit}</span>
        <span class="chip">${keys.length} 个月份</span>
      `;
      SunevoDash.renderDashboard(state);
    }

    document.querySelectorAll("[data-account]").forEach((btn) => {
      btn.addEventListener("click", () => loadAccount(btn.dataset.account));
    });

    sheetSelect.addEventListener("change", () => {
      state.activeSheet = sheetSelect.value;
      applySheet();
    });

    document.getElementById("pickFile").addEventListener("click", () => fileInput.click());
    document.getElementById("exportBtn").addEventListener("click", () => {
      SunevoDash.exportStoreJson(state.platform);
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("确认清空本机已保存的该平台数据，并恢复内置样例？")) return;
      SunevoDash.clearSavedPlatform(state.platform);
      loadAccount(state.platform);
    });

    function handleFile(file) {
      if (!file) return;
      setStatus(`正在解析并保存：${file.name} …`);
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array", cellDates: true });
          const parsed = SunevoDash.parseWorkbook(wb);
          const result = SunevoDash.mergeAndSave(parsed.platform, parsed.sheets, {
            fileName: file.name,
          });
          state.platform = parsed.platform;
          state.account = parsed.platform;
          state.kind = parsed.kind || (isJiangwei(parsed.platform) ? "daily" : "works");
          state.sheets = structuredClone(result.sheets);
          state.source = "saved";
          state.fileName = file.name;
          state.added = result.added;
          state.replaced = result.replaced;
          const keys = SunevoDash.sortSheetNames(Object.keys(state.sheets));
          const touched = SunevoDash.sortSheetNames(
            [].concat(result.added || [], result.replaced || [])
          );
          state.activeSheet =
            (touched.length ? touched[touched.length - 1] : null) ||
            pickDefaultSheet(keys);
          refreshChrome();
          rebuildSheetSelect();
          applySheet();
          const addText = result.added.length
            ? `新增 ${result.added.join("、")}`
            : "无新月份";
          const repText = result.replaced.length
            ? `更新 ${result.replaced.join("、")}`
            : "无覆盖月份";
          setStatus(
            `已识别「${accountLabel(parsed.platform)}」并自动保存。${addText}；${repText}。当前共 ${keys.length} 个月份。`,
            "ok"
          );
          sourceChip.textContent = `来源：本机保存 · ${file.name}`;
        } catch (err) {
          setStatus(err.message || String(err), "err");
        }
      };
      reader.onerror = () => setStatus("读取文件失败，请重试。", "err");
      reader.readAsArrayBuffer(file);
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      handleFile(file);
      fileInput.value = "";
    });

    loadAccount(
      new URLSearchParams(location.search).get("account") || "douyin"
    );
  </script>
</body>
</html>
